[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stateofups"
version = "1.0.0"
description = "PowerChute Serial Shutdown (PCSS) log analyzer + live tray for the APC BX2000M-LM UPS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=3.0",
    "numpy>=2.3",
    "requests>=2.32",
    "beautifulsoup4>=4.13",
    "pystray>=0.19",
    "Pillow>=11.0",
    "keyring>=25",
    # Generic Java-deserialization reader for the binary EventLog (pure
    # Python). The loader degrades gracefully when it is absent.
    "javaobj-py3>=0.4",
]

[project.optional-dependencies]
# Granular extras so each CI job installs only what it needs — the lint+unit
# job skips the ~36 MiB Playwright download entirely.
lint = ["ruff>=0.6", "mypy>=1.11"]
test = ["pytest>=8.0", "pytest-xdist>=3.6", "pytest-rerunfailures>=14.0"]
e2e = ["playwright>=1.49"]
# Everything, for local development (one install does it all).
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "playwright>=1.49",
]

[project.scripts]
ups-analyze = "analyze_ups:main"

[tool.setuptools]
py-modules = ["analyze_ups", "tray_status"]
packages = ["pcss"]
include-package-data = true

[tool.setuptools.package-data]
pcss = ["*.js"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import-sort, UP pyupgrade, B bugbear, SIM simplify.
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 (line length) is handled by line-length; keep it off so data tables /
# long hovertemplate strings don't churn.
ignore = ["E501"]

[tool.mypy]
# numpy 2.x ships stubs that use PEP 695 `type` aliases, which mypy only
# accepts when the type-check target is 3.12 or newer — targeting 3.11 makes
# mypy fail inside numpy/__init__.pyi on any fresh install (this is what
# broke CI). The runtime floor stays requires-python >= 3.11.
python_version = "3.12"
ignore_missing_imports = true   # pystray / bs4 / PIL / keyring ship partial or no stubs
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # make pcss / analyze_ups / tray_status importable from tests
python_files = ["test_*.py", "e2e_*.py"]   # collect the e2e suites too
markers = [
    "e2e: browser-driven Playwright dashboard tests (slow; need a generated dashboard)",
]
