name: CI

# PowerChute Serial Shutdown is a Windows product and the tray uses the Windows
# Credential Manager + a Windows tray backend, so the test jobs run on Windows.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `e2e` label to an open PR triggers a run.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on a PR branch; every push to main is fully tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The runner cache (D:) and install target (C:) are different filesystems, so
  # uv's hardlink fails and falls back to copy with a warning. Tell it to copy
  # up front — no failed-hardlink probe, no warning.
  UV_LINK_MODE: copy

jobs:
  # Detect whether anything other than Markdown changed, so docs-only changes
  # skip the test job. A plain git diff (full-history checkout) replaces the
  # old dorny/paths-filter action: the action lagged on the Node 24 runtime
  # and could not diff a shallow checkout, which made docs-only pushes run the
  # full test job anyway.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --quiet origin "$BASE_REF"
            range="$(git merge-base HEAD "origin/$BASE_REF")..HEAD"
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A manual dispatch, a brand-new branch, or a force-push whose
            # "before" commit is gone: assume code changed rather than skip.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$range" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Always-on for code changes: lint + types + the fast unit suite (no browser).
  # Installs only lint + test extras — NOT Playwright — so the install is lean.
  lint-unit:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: lint
      - name: Install (runtime + lint + test)
        run: uv pip install --system -e ".[lint,test]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Types (mypy)
        run: python -m mypy pcss analyze_ups.py tray_status.py
      - name: Unit tests (no browser)
        run: python -m pytest tests -m "not e2e" -q

  # Slow browser suite — OPT-IN ONLY (it's expensive). It runs when:
  #   * a pull request carries the `e2e` label (add the label to trigger), or
  #   * the workflow is dispatched manually (Actions tab → Run workflow).
  # It does NOT run on ordinary pushes/PRs.
  e2e:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-suffix: e2e
      - name: Install (runtime + test + e2e)
        run: uv pip install --system -e ".[test,e2e]"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Browser E2E tests
        run: python -m pytest tests -m e2e -n auto --dist worksteal --reruns 2 --reruns-delay 1 -q

  # Single required status check. Always runs, so a required check always reports
  # a result even when the E2E job was skipped (the common case) or lint-unit was
  # skipped for a docs-only change.
  ci-required:
    needs: [lint-unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          LINT_UNIT: ${{ needs.lint-unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "lint-unit=$LINT_UNIT  e2e=$E2E"
          for r in "$LINT_UNIT" "$E2E"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass."
              exit 1
            fi
          done
          echo "All required CI jobs passed or were skipped."
