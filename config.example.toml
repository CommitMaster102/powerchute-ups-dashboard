# stateOfUPS configuration. Copy to config.toml (auto-loaded from the repo root)
# or pass an explicit path with --config. Every value is optional; anything you
# omit falls back to the built-in default in pcss/config.py. CLI flags
# (--agent-dir, --output) override the file.

[paths]
# Where PCSS writes its logs. Change if PCSS is reinstalled elsewhere.
pcss_agent = 'C:\Program Files\APC\PowerChute Serial Shutdown\agent'
# Path to a user-owned CSV of actual whole-house bills, for bill
# reconciliation against the analyzer's own tariff arithmetic (roadmap item
# 29). Columns: period_start (YYYY-MM-DD, must exactly match a
# billing-period start for billing_cycle_start_day below), kwh (the billed
# kWh for the whole house), amount_crc (the billed amount); header row
# required. See bills.example.csv for the exact shape. Defaults to
# bills.csv in the repo root; a missing file simply disables the feature —
# reconciliation is opt-in per bill, not a required habit. The analyzer only
# ever reads this file; it is personal data, like credentials.txt, and is
# gitignored.
bills_file = 'bills.csv'
# Path to a user-owned CSV of dated lifecycle entries — battery replaced, a
# new appliance added, the UPS moved — for the battery replace-by
# projection's fit segmentation and labeled markers on the dashboard's time
# panels (roadmap item 26). Columns: date (YYYY-MM-DD), kind (freeform text;
# the analyzer only ever recognizes "battery_replaced" as a fit-segmentation
# boundary), label (a short note shown on the marker). See
# annotations.example.csv for the exact shape. Defaults to annotations.csv
# in the repo root; a missing file simply disables the feature. The analyzer
# only ever reads this file; it is personal data, like credentials.txt and
# bills.csv, and is gitignored.
annotations_file = 'annotations.csv'

[tariff]                 # CRC per kWh; Coopesantos T-RE Residencial.
coopesantos_low  = 78.17 # first `tier_limit_kwh` per billing period
coopesantos_high = 126.51
tier_limit_kwh   = 200.0
pcss_flat        = 126.51 # single rate PCSS itself reports with
# Day of the month the Coopesantos billing cycle starts on. 1 groups costs by
# calendar month; any other day groups by billing period (labeled by the
# period's start date) and applies the tier limit per period. Periods the
# recorded data does not fully cover are marked as partial.
billing_cycle_start_day = 1
# Minimum distinct days of energylog evidence inside the current billing
# period before the end-of-period cost forecast (Period Comparison card
# subtitle, console line, --json "forecast" key) will project anything. Below
# this floor the forecast reports "not enough of the period recorded yet"
# with no numbers, the same honesty pattern as battery_trend_min_days below.
forecast_min_days = 5

# Coopesantos revises these rates quarterly. The four keys above are always
# the "current" rates: they price every billing period when no history is
# configured below, and they price any period that starts before the
# earliest history entry (or every period, if the array is empty or left out
# entirely — the default, needing no changes to an existing config file). Add
# one [[tariff.history]] entry per past rate change to price each billing
# period with the rates that were actually in force: a period is priced by
# the newest entry whose effective_from is at or before the period's start
# date. Once at least one entry exists, the console breakdown, the
# dashboard's Billing Periods table, and --json all say which rates priced
# each period (a short tag like "rates from 2026-04-01", or "current rates"
# for the flat-key fallback) — so a rate boundary mid-history doesn't read as
# a consumption change.
#
# [[tariff.history]]
# effective_from  = "2026-04-01"
# coopesantos_low  = 82.30
# coopesantos_high = 133.10
# tier_limit_kwh   = 200.0
# pcss_flat        = 133.10

[grid]
co2_kg_per_kwh = 0.098    # Costa Rica grid intensity (Low Carbon Power 2024)

[thresholds]
voltage_normal_low  = 114.0  # NEC ±5% of 120V
voltage_normal_high = 126.0
high_load_pct       = 80.0
datalog_expected_interval_min = 20.0
# Log-staleness watchdog: how old the newest DataLog sample must be before the
# console, health pill, and alerts flag a dead serial link, a stopped service,
# or a wedged agent instead of an ordinary quiet night with the PC off.
stale_warn_hours = 12.0
stale_crit_hours = 48.0
# KPI status-pill cut points (dashboard header row).
battery_charge_warn_pct = 90.0  # WARN below this % charge
battery_charge_crit_pct = 50.0  # ALERT below this % charge
runtime_warn_min        = 15.0  # WARN below this many estimated minutes
runtime_crit_min        = 7.0   # ALERT below this many estimated minutes
# On-battery episode inference: a line-voltage sample below on_battery_voltage_v
# is a mains-loss candidate, kept only when the battery capacity fell by at
# least on_battery_capacity_drop_pct in the same window. The 20-minute DataLog
# cadence misses most short outages; this detects episodes visible at that
# cadence, not all outages.
on_battery_voltage_v         = 50.0
on_battery_capacity_drop_pct = 1.0
# Battery replace-by projection. 25.6 V is 2.13 V per cell across the 12 cells
# of the 24 V lead-acid pack — the bottom of the float band. The projection
# stays silent until the history spans battery_trend_min_days, because a slope
# over a few weeks is noise.
battery_replace_voltage_v = 25.6
battery_trend_min_days    = 60.0

[dashboard]
# Dashboard color theme: "dark" (the designed default) or "light".
theme = "dark"
# UPS model name shown in the dashboard header.
model = "APC BX2000M-LM"
# Page language: "en" or "es". Number formatting stays en-US in both (the CSV
# export is machine-standard).
language = "en"
# Auto-refresh interval in minutes for a dashboard left open on a monitor
# (emits a meta refresh matched to your scheduled-task cadence). 0 disables
# it. The permalink hash keeps the view state across the reload.
refresh_minutes = 0

[runtime_curve]          # empirical BX2000M-LM: watts -> minutes of runtime
watts   = [0, 100, 150, 250, 500, 600, 800, 1200]
minutes = [60, 40, 30, 15, 5, 3.5, 2, 0]
# Minimum number of usable discharge observations (roadmap item 16) before the
# Estimated Runtime card draws a measured overlay next to this configured
# curve. An observation needs a real capacity drop (at least one percentage
# point) and an energylog power sample within the outage span, so most short
# outages contribute nothing. Below this floor the card names the honest
# "not enough discharge data yet" instead of drawing a curve fitted to too
# few discharges.
calibration_min_episodes = 3

[alerts]
# Opt-in. When true, a run that finds voltage anomalies, sustained high-load
# episodes, or inferred on-battery episodes appends one line to
# output/alerts.log. The tray icon watches that file and raises a Windows
# toast for new lines (30-minute cooldown). Off by default.
enabled = false

[archive]
# PCSS keeps roughly one month of DataLog samples. When enabled (the default),
# each analyzer run appends the freshly loaded rows to monthly partitions
# under output/archive/ and merges the archive back in, so charts and trends
# span the whole recorded life of the UPS. --no-snapshot skips the append.
enabled = true
